# Celeste picom config made by Qw3rty26
backend = "xrender";

# Shadows
shadow = true;
shadow-radius = 7;      
shadow-offset-x = -2;
shadow-offset-y = -2;
shadow-opacity = 0.25;   # subtle shadow

# Fading / Transparency
fading = false;
fade-in-step = 0.02;
fade-out-step = 0.02;

# Opacity for inactive windows (subtle)
inactive-opacity = 0.95;
active-opacity = 1.0;

# Transparent windows
opacity-rule = [
    "90:class_g = 'kitty'",
];

# Other
corner-radius = 10;       # rounded corners
