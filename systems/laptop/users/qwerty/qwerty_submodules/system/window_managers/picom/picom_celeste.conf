# Lightweight Picom config for i3
backend = "xrender";  # Xrender is lighter than OpenGL

# Shadows
shadow = true;
shadow-radius = 7;       # smaller radius = lighter
shadow-offset-x = -2;
shadow-offset-y = -2;
shadow-opacity = 0.25;   # subtle shadow

# Fading / Transparency
fading = true;
fade-in-step = 0.03;     # smaller step = smoother
fade-out-step = 0.03;

# Opacity for inactive windows (subtle)
inactive-opacity = 0.95;
active-opacity = 1.0;

# Transparent windows (like terminals)
# Kitty transparency works better with opacity-rule
opacity-rule = [
    "90:class_g = 'kitty'",
    "90:class_g = 'Alacritty'"
];

# Other
corner-radius = 6;       # slightly rounded corners
